services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utilitypay}
      POSTGRES_USER: ${POSTGRES_USER:-utilitypay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-utilitypay}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-utilitypay} -d ${POSTGRES_DB:-utilitypay}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: celery -A utilitypay worker -l info
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    build: .
    command: celery -A utilitypay beat -l info
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
